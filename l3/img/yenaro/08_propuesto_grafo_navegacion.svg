<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" font-family="sans-serif" font-size="13">
  <rect x="20" y="90" width="150" height="70" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
  <text x="95" y="118" text-anchor="middle" font-weight="bold">login</text>
  <text x="95" y="138" text-anchor="middle">LoginScreen</text>
  <rect x="245" y="90" width="150" height="70" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2"/>
  <text x="320" y="118" text-anchor="middle" font-weight="bold">registro</text>
  <text x="320" y="138" text-anchor="middle">RegistroScreen</text>
  <rect x="470" y="90" width="150" height="70" rx="10" fill="#E6F4EA" stroke="#34A853" stroke-width="2"/>
  <text x="545" y="118" text-anchor="middle" font-weight="bold">home/{usuario}</text>
  <text x="545" y="138" text-anchor="middle">HomeScreen</text>
  <line x1="170" y1="115" x2="245" y2="115" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="207" y="105" text-anchor="middle" font-size="11">navigate</text>
  <line x1="245" y1="145" x2="170" y2="145" stroke="#111" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <text x="207" y="160" text-anchor="middle" font-size="11">popBackStack</text>
  <line x1="170" y1="60" x2="470" y2="60" stroke="#111" stroke-width="2" marker-end="url(#a)"/>
  <text x="320" y="50" text-anchor="middle" font-size="11">navigate("home/$usuario") al validar</text>
  <line x1="545" y1="160" x2="95" y2="160" stroke="#111" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <text x="320" y="178" text-anchor="middle" font-size="11">popBackStack("login", false) al cerrar sesión</text>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111"/></marker></defs>
