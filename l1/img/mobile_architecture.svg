<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="542px" preserveAspectRatio="none" style="width:492px;height:542px;background:#FFFFFF;" version="1.1" viewBox="0 0 492 542" width="492px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><!--entity APP--><g class="entity" data-qualified-name="APP" data-source-line="23" id="ent0001"><rect fill="#FCE8E6" height="52.6882" rx="5" ry="5" style="stroke:#C5221F;stroke-width:1.5;" width="237.3815" x="129.8" y="7"/><text fill="#900C3F" font-family="'sans-serif'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="41.5293" x="139.8" y="29.8281">Spotify</text><text fill="#900C3F" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="217.3815" x="139.8" y="46.1722">(app h&#237;brida de streaming multimedia)</text></g><!--entity UI--><g class="entity" data-qualified-name="UI" data-source-line="25" id="ent0002"><rect fill="#E8F0FE" height="101.7206" rx="5" ry="5" style="stroke:#1A73E8;stroke-width:1.5;" width="216.8134" x="18.09" y="119.69"/><text fill="#174EA6" font-family="'sans-serif'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="113.4278" x="28.09" y="142.5181">Interfaz de usuario</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="3.12" x="28.09" y="158.8622">&#160;</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="180.9012" x="28.09" y="175.2063">Barra de navegaci&#243;n, cuadr&#237;cula</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="155.8811" x="28.09" y="191.5504">de acceso r&#225;pido, secciones</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="196.8134" x="28.09" y="207.8945">recomendadas y mini-reproductor.</text></g><!--entity LOGIC--><g class="entity" data-qualified-name="LOGIC" data-source-line="27" id="ent0003"><rect fill="#E8F0FE" height="101.7206" rx="5" ry="5" style="stroke:#1A73E8;stroke-width:1.5;" width="202.5813" x="272.2" y="119.69"/><text fill="#174EA6" font-family="'sans-serif'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="154.471" x="282.2" y="142.5181">L&#243;gica de funcionamiento</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="3.12" x="282.2" y="158.8622">&#160;</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="182.5813" x="282.2" y="175.2063">Decodifica audio, gestiona b&#250;fer</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="178.9453" x="282.2" y="191.5504">de streaming continuo y calcula</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="103.5247" x="282.2" y="207.8945">recomendaciones.</text></g><!--entity EVENTS--><g class="entity" data-qualified-name="EVENTS" data-source-line="29" id="ent0004"><rect fill="#E8F0FE" height="101.7206" rx="5" ry="5" style="stroke:#1A73E8;stroke-width:1.5;" width="230.9855" x="7" y="281.41"/><text fill="#174EA6" font-family="'sans-serif'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="112.5578" x="17" y="304.2381">Manejo de eventos</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="3.12" x="17" y="320.5822">&#160;</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="205.4295" x="17" y="336.9263">Detecta toques en canciones, gestos</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="210.9855" x="17" y="353.2704">en el mini-reproductor y desconexi&#243;n</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="76.9205" x="17" y="369.6145">de aud&#237;fonos.</text></g><!--entity NAV--><g class="entity" data-qualified-name="NAV" data-source-line="31" id="ent0005"><rect fill="#E8F0FE" height="101.7206" rx="5" ry="5" style="stroke:#1A73E8;stroke-width:1.5;" width="205.7973" x="272.59" y="281.41"/><text fill="#174EA6" font-family="'sans-serif'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="163.1051" x="282.59" y="304.2381">Navegaci&#243;n entre pantallas</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="3.12" x="282.59" y="320.5822">&#160;</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="173.1972" x="282.59" y="336.9263">Pasa de Inicio/B&#250;squeda a una</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="185.7973" x="282.59" y="353.2704">playlist, al reproductor a pantalla</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="109.1048" x="282.59" y="369.6145">completa o ajustes.</text></g><!--entity DATA--><g class="entity" data-qualified-name="DATA" data-source-line="33" id="ent0006"><rect fill="#E8F0FE" height="85.3765" rx="5" ry="5" style="stroke:#1A73E8;stroke-width:1.5;" width="287.3138" x="104.84" y="443.13"/><text fill="#174EA6" font-family="'sans-serif'" font-size="12" font-weight="700" lengthAdjust="spacing" textLength="155.2" x="114.84" y="465.9581">Almacenamiento de datos</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="3.12" x="114.84" y="482.3022">&#160;</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="267.3138" x="114.84" y="498.6463">Guarda m&#250;sica descargada y cach&#233; localmente;</text><text fill="#174EA6" font-family="'sans-serif'" font-size="12" lengthAdjust="spacing" textLength="229.8976" x="114.84" y="514.9904">sincroniza playlists e historial en la nube.</text></g><!--link APP to UI--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="35" id="lnk7"><path d="M225.26,60.1 C210.19,76.8 193.3892,95.4075 175.2292,115.5375" fill="none" id="APP-to-UI" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="171.88,119.25,180.8786,115.2468,175.2292,115.5375,174.9385,109.8881,171.88,119.25" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link APP to LOGIC--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" data-link-type="dependency" data-source-line="36" id="lnk8"><path d="M272.3,60.1 C287.74,76.8 304.9858,95.4486 323.5958,115.5786" fill="none" id="APP-to-LOGIC" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="326.99,119.25,323.8176,109.9261,323.5958,115.5786,317.9433,115.3568,326.99,119.25" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link UI to EVENTS--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="37" id="lnk9"><path d="M125.24,221.65 C124.76,240.59 124.344,257.1315 123.874,276.0815" fill="none" id="UI-to-EVENTS" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="123.75,281.08,127.9719,272.1819,123.874,276.0815,119.9744,271.9836,123.75,281.08" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link LOGIC to NAV--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="38" id="lnk10"><path d="M374.12,221.65 C374.36,240.59 374.5693,257.1304 374.7993,276.0804" fill="none" id="LOGIC-to-NAV" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="374.86,281.08,378.7505,272.0321,374.7993,276.0804,370.7511,272.1292,374.86,281.08" style="stroke:#181818;stroke-width:1;stroke-linejoin:m